name: Static Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint (go vet)
        run: go vet ./...

      - name: Types (go build)
        run: go build ./...

      - name: Test (go test)
        run: go test ./...

      - name: Cross-build release targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "$target"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/gocron
          done
